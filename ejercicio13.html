<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Voto</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="CSS/ejercicio13.css">
</head>
<body>

    <div class="container">
        <h2>¿Puedes Votar?</h2>
        
        <div class="form-group">
            <label for="inputEdad">Ingresa tu edad:</label>
            <input type="text" id="inputEdad" placeholder="Ej. 20">
            <div id="mensajeError">Por favor, ingrese un número entero positivo válido.</div>
        </div>

        <div class="form-group">
            <button id="btnVerificar">Verificar</button>
        </div>

        <div class="form-group">
            <label for="outputResultado">Resultado:</label>
            <input type="text" id="outputResultado" readonly placeholder="Resultado">
        </div>
        <div class="form-group" style="margin-top: 25px;">
            <a href="index.html" class="btn-regresar">Regresar al Menú</a>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="JS/ejercicio13.js"></script>
</body>
</html>
