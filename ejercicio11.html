<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Kilómetros a Millas</title>
    
    <link rel="stylesheet" href="CSS/ejercicio11.css">
</head>
<body>

    <div class="container">
        <h2>Conversor de Kilómetros a Millas</h2>
        
        <div class="form-group">
            <label for="inputKm">Distancia en Kilómetros (km):</label>
            <input type="text" id="inputKm" placeholder="Ej. 10">
            <div id="mensajeError">Por favor, ingrese un número válido.</div>
        </div>

        <div class="form-group">
            <button id="btnConvertir">Convertir</button>
        </div>

        <div class="form-group">
            <label for="outputMillas">Distancia en Millas (mi):</label>
            <input type="text" id="outputMillas" readonly placeholder="Resultado">
        </div>
        <div class="form-group" style="margin-top: 25px;">
            <a href="index.html" class="btn-regresar">Regresar al Menú</a>
        </div>
    </div>

   
    <script src="JS/ejercicio11.js"></script>
</body>
</html>
