<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de MXN a USD</title>
   
    <link rel="stylesheet" href="CSS/ejercicio12.css">
</head>
<body>

    <div class="container">
        <h2>Conversor MXN a USD</h2>
        
        <div class="form-group">
            <label for="inputMxn">Cantidad en Pesos (MXN):</label>
            <input type="text" id="inputMxn" placeholder="Ej. 500">
            <div id="mensajeError">Por favor, ingrese un número válido y positivo.</div>
        </div>

        <div class="form-group">
            <button id="btnConvertir">Convertir</button>
        </div>

        <div class="form-group">
            <label for="outputUsd">Monto en Dólares (USD):</label>
            <input type="text" id="outputUsd" readonly placeholder="Resultado">
        </div>
        <div class="form-group" style="margin-top: 25px;">
            <a href="index.html" class="btn-regresar">Regresar al Menú</a>
        </div>
    </div>

  
    <script src="JS/ejercicio12.js"></script>
</body>
</html>
