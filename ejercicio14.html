<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones con Arreglos de Números</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="CSS/ejercicio14.css">
</head>
<body>

    <div class="container">
        <h2>Operaciones con Números</h2>
        
        <div class="form-group">
            <label for="inputNumeros">Ingresa números separados por comas:</label>
            <input type="text" id="inputNumeros" placeholder="Ej. 10, 5, 20, 8">
            <div id="mensajeError">Por favor, ingresa solo números válidos separados por comas.</div>
        </div>

        <div class="form-group">
            <button id="btnCalcular">Calcular</button>
        </div>

        <div class="form-group">
            <label for="outputMayor">Número Mayor:</label>
            <input type="text" id="outputMayor" readonly placeholder="Resultado">
        </div>

        <div class="form-group">
            <label for="outputMenor">Número Menor:</label>
            <input type="text" id="outputMenor" readonly placeholder="Resultado">
        </div>

        <div class="form-group">
            <label for="outputPromedio">Promedio:</label>
            <input type="text" id="outputPromedio" readonly placeholder="Resultado">
        </div>
        <div class="form-group" style="margin-top: 25px;">
            <a href="index.html" class="btn-regresar">Regresar al Menú</a>
        </div>
    </div>
     
    <!-- Enlace al archivo JavaScript externo -->
    <script src="JS/ejercicio14.js"></script>
</body>
</html>
